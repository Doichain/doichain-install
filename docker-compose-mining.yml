version: '3.7'

services:
  bitcoin-init:
    # First-run bootstrap: fetch doi.works' nightly pruned snapshot into the bitcoin
    # data volume so bitcoind starts near the chain tip instead of a multi-hour IBD.
    # This replaces the dead prunednode.today URL baked into the doichain/bitcoind
    # image (that domain expired). No-op if a chainstate already exists in the volume.
    # Needs ~25 GB free during bootstrap (11 GB download + ~13 GB extracted), ~13 GB after.
    image: alpine:3.20
    volumes:
      - bitcoin-volume:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /data/bitcoin/chainstate/CURRENT ]; then
          echo "bitcoin chainstate present -> skip bootstrap"; exit 0
        fi
        echo "bootstrapping pruned bitcoin snapshot from doi.works ..."
        apk add --no-cache curl tar >/dev/null
        mkdir -p /data/bitcoin
        curl -fL --retry 5 --retry-delay 5 -C - https://www.doi.works/pruned/bitcoin-pruned.tgz -o /data/snapshot.tgz
        tar xzf /data/snapshot.tgz -C /data/bitcoin --strip-components=1
        rm -f /data/snapshot.tgz
        echo "bootstrap done: $(ls /data/bitcoin)"
    restart: "no"
    networks:
      static-network:
        ipv4_address: 172.21.0.4

  bitcoin:
    image: "doichain/bitcoind:v0.20.0"
    container_name: bitcoin
    hostname: bitcoin
    depends_on:
      bitcoin-init:
        condition: service_completed_successfully
    ports:
      - "8332:8332"
      - "8333:8333"
    volumes:
     - bitcoin-volume:/home/bitcoin/data
    environment:
      - RPC_PASSWORD=password
      - RPC_ALLOW_IP=0.0.0.0/0 #::/0
    stdin_open: true
    tty: true
    networks:
      static-network:
        ipv4_address: 172.21.0.5

  doichain:
   build:
     context: ./doichain
     args:
       DOICHAIN_VER: "v31.1.2"   # release tag
   image: "doichain/core:v31.1.2"
   container_name: doichain
   hostname: doichain
   ports:
     - "8338:8338"   # P2P - required, see bind= in the generated conf
     - "8339:8339"   # RPC
   volumes:
     - doichain-volume:/home/doichain/data
   environment:
     - RPC_PASSWORD=password
     - RPC_ALLOW_IP=0.0.0.0/0 #::/0
     # Peer discovery is currently broken: dnsseed.doichain.org and seed.doi.works
     # return zero addresses and the binary has no fixed seeds compiled in, so a
     # node with an empty addrman never finds the network ("Added 0 fixed seeds").
     # These are peers observed serving mainnet on 2026-09-11. Remove once the
     # seeds work again -- see https://github.com/Doichain/doichain-install/issues/3
     - DOICHAIN_EXTRA_ARGS=-addnode=2.28.75.43 -addnode=136.243.155.62 -addnode=116.203.99.217 -addnode=128.140.44.20 -addnode=195.201.129.97 -addnode=94.130.57.196
   stdin_open: true
   tty: true
   networks:
     static-network:
       ipv4_address: 172.21.0.6

  p2pool:
    image: "doichain/p2pool:v34.0"
    container_name: p2pool 
    hostname: p2pool
    stdin_open: true
    tty: true
    ports: 
      - "9332:9332"
    volumes:
      - bitcoin-volume:/data/bitcoin
      - doichain-volume:/data/doichain
    environment:
      - P2POOL_DOICHAIN_DEFAULT_ADDR=${P2POOL_DOICHAIN_DEFAULT_ADDR}
      - P2POOL_BITCOIN_DEFAULT_ADDR=${P2POOL_BITCOIN_DEFAULT_ADDR}
      - DOICHAIN_RPC_USER=admin
      - DOICHAIN_RPC_PASSWORD=password
      - DOICHAIN_RPC_HOST=doichain
      - DOICHAIN_RPC_PORT=8339
    networks:
      static-network:
        ipv4_address: 172.21.0.8

volumes:
  bitcoin-volume:
  doichain-volume:
  dapp-volume:

networks:
  static-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16