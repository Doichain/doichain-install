# Doichain mining stack: bitcoind (merge-mining parent), doichaind, p2pool and
# ElectrumX. Secrets come from .env (see .env.mining.example); nothing below has
# a usable default password.
#
# RPC ports are deliberately NOT published. p2pool and ElectrumX reach the
# daemons over the compose network (172.21.0.0/16), and a published RPC port --
# doichaind has a wallet behind it -- would be an open door. Only the P2P ports,
# the p2pool port and ElectrumX's client ports face the outside.

services:
  bitcoin-init:
    # First-run bootstrap: fetch doi.works' nightly pruned snapshot into the bitcoin
    # data volume so bitcoind starts near the chain tip instead of a multi-hour IBD.
    # This replaces the dead prunednode.today URL baked into the doichain/bitcoind
    # image (that domain expired). No-op if a chainstate already exists in the volume.
    # Needs ~25 GB free during bootstrap (11 GB download + ~13 GB extracted), ~13 GB after.
    image: alpine:3.20
    volumes:
      - bitcoin-volume:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /data/bitcoin/chainstate/CURRENT ]; then
          echo "bitcoin chainstate present -> skip bootstrap"; exit 0
        fi
        echo "bootstrapping pruned bitcoin snapshot from doi.works ..."
        apk add --no-cache curl tar >/dev/null
        mkdir -p /data/bitcoin
        curl -fL --retry 5 --retry-delay 5 -C - https://www.doi.works/pruned/bitcoin-pruned.tgz -o /data/snapshot.tgz
        tar xzf /data/snapshot.tgz -C /data/bitcoin --strip-components=1
        rm -f /data/snapshot.tgz
        echo "bootstrap done: $(ls /data/bitcoin)"
    restart: "no"
    networks:
      static-network:
        ipv4_address: 172.21.0.4

  bitcoin:
    image: "doichain/bitcoind:v0.20.0"
    container_name: bitcoin
    hostname: bitcoin
    restart: unless-stopped
    depends_on:
      bitcoin-init:
        condition: service_completed_successfully
    ports:
      - "8333:8333"   # P2P only; RPC (8332) stays on the compose network
    volumes:
     - bitcoin-volume:/home/bitcoin/data
    environment:
      # Written into bitcoin.conf on the FIRST start only (see bitcoin/entrypoint.sh).
      - RPC_PASSWORD=${BITCOIN_RPC_PASSWORD:?set BITCOIN_RPC_PASSWORD in .env}
      - RPC_ALLOW_IP=172.21.0.0/16
    stdin_open: true
    tty: true
    networks:
      static-network:
        ipv4_address: 172.21.0.5

  doichain:
   # Pulled from Docker Hub: built from the signed tag v31.1.5 (commit 6b95bf8412),
   # the release whose binaries run on the fleet. To build it yourself instead:
   #   docker build --build-arg DOICHAIN_VER=v31.1.5 -t doichain/core:v31.1.5 ./doichain
   image: "doichain/core:v31.1.5"
   container_name: doichain
   hostname: doichain
   # The node is useless to the network if it cannot be reached: without an
   # inbound path it never appears in anyone's addrman, the DNS seeder never
   # learns it, and it can only ever make outbound connections. Publishing 8338
   # is therefore not optional -- a node started with plain `docker run` and no
   # -p was listening happily inside its namespace with connections_in=0.
   restart: unless-stopped
   ports:
     - "8338:8338"   # P2P - required, see bind= in the generated conf
   volumes:
     - doichain-volume:/home/doichain/data
   environment:
     # Written into doichain.conf on the FIRST start only (see doichain/entrypoint.sh).
     - RPC_PASSWORD=${DOICHAIN_RPC_PASSWORD:?set DOICHAIN_RPC_PASSWORD in .env}
     - RPC_ALLOW_IP=172.21.0.0/16
     # Set this to the host's public address on any node that should be
     # reachable. Publishing 8338 above is necessary but not sufficient: Core
     # derives the address it advertises from the local interfaces, which in a
     # container means a private 172.x it will never announce. Without this the
     # node happily accepts inbound connections while telling nobody it exists,
     # so no peer gossips it and no DNS seeder ever finds it.
     - EXTERNAL_IP=${EXTERNAL_IP:-}
     # Peer discovery needs no help any more: v31.1.4 and later ship fixed seeds
     # that all follow DigiShield, dnsseed.doichain.org hands out DigiShield
     # nodes, and v31.1.5 fixed the header sync that kept a fresh node from
     # finishing (it now has all headers within minutes). Extra arguments such
     # as -addnode=<host> can still be passed from .env.
     - DOICHAIN_EXTRA_ARGS=${DOICHAIN_EXTRA_ARGS:-}
   stdin_open: true
   tty: true
   networks:
     static-network:
       ipv4_address: 172.21.0.6

  p2pool:
    image: "doichain/p2pool:v34.0"
    container_name: p2pool
    hostname: p2pool
    restart: unless-stopped
    depends_on:
      - bitcoin
      - doichain
    stdin_open: true
    tty: true
    ports:
      - "9332:9332"
    volumes:
      # p2pool reads bitcoind's RPC credentials from bitcoin.conf, through the
      # image's ~/.bitcoin -> /data/bitcoin/bitcoin symlink.
      - bitcoin-volume:/data/bitcoin
      # The sharechain MUST persist. Without it, every restart makes p2pool pull a
      # fresh ~17k-share chain from its peers and re-verify it at roughly 5 shares
      # per minute -- about 29 hours on a 2-core host -- and it rejects every miner
      # with "p2pool is downloading shares" for the whole time. With an empty data
      # dir it serves work within seconds instead.
      #
      # Let compose create this volume; it then inherits /usr/src/p2pool/data from
      # the image, which is owned by the unprivileged p2pool user (uid 1000). A
      # volume created by hand beforehand can end up root-owned, in which case
      # p2pool dies at startup with
      #   OSError: [Errno 13] Permission denied: '/usr/src/p2pool/data/bitcoin'
      # Fix by chowning it: docker run --rm -v p2pool-data:/d alpine chown -R 1000:1000 /d
      - p2pool-data:/usr/src/p2pool/data
      # The published v34.0 image (2022) predates the fixed start.sh: it bakes
      # the merged-mining URL in at build time, so DOICHAIN_RPC_* -- and any
      # password other than "password" -- never reached p2pool. Mount the
      # repository's version, which composes the URL at runtime.
      - ./p2pool/start.sh:/start.sh:ro
    environment:
      - P2POOL_DOICHAIN_DEFAULT_ADDR=${P2POOL_DOICHAIN_DEFAULT_ADDR}
      - P2POOL_BITCOIN_DEFAULT_ADDR=${P2POOL_BITCOIN_DEFAULT_ADDR}
      - DOICHAIN_RPC_USER=admin
      - DOICHAIN_RPC_PASSWORD=${DOICHAIN_RPC_PASSWORD:?set DOICHAIN_RPC_PASSWORD in .env}
      - DOICHAIN_RPC_HOST=doichain
      - DOICHAIN_RPC_PORT=8339
    networks:
      static-network:
        ipv4_address: 172.21.0.8

  electrumx:
    # ElectrumX for Electrum wallets (Doichain/electrumx, ElectrumX 1.15.0 with
    # the Doichain coin class). It indexes what doichaind serves -- from empty
    # volumes, node and index were complete after ~25 minutes in our test -- and
    # does no consensus validation of its own.
    build:
      context: ./electrumx
      additional_contexts:
        electrumx-src: "https://github.com/Doichain/electrumx.git#94d109070bc32118ca6e54182a4a2a94568c68ee"
      args:
        ELECTRUMX_REF: "94d109070bc32118ca6e54182a4a2a94568c68ee"
    image: "doichain/electrumx:v1.15.0-doi1"
    container_name: electrumx
    hostname: electrumx
    restart: unless-stopped
    depends_on:
      - doichain
    ports:
      - "50001:50001"   # TCP
      - "50002:50002"   # SSL
      - "50004:50004"   # WSS
    volumes:
      - electrumx-db:/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # The explicit :8339 matters: the coin class defaults to 8338, the P2P port.
      - DAEMON_URL=http://admin:${DOICHAIN_RPC_PASSWORD:?set DOICHAIN_RPC_PASSWORD in .env}@doichain:8339/
      - REPORT_HOST=${ELECTRUMX_REPORT_HOST:-}
    networks:
      static-network:
        ipv4_address: 172.21.0.9

volumes:
  bitcoin-volume:
  doichain-volume:
  dapp-volume:
  p2pool-data:
  electrumx-db:

networks:
  static-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
